<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" font-family="Helvetica,Arial,sans-serif"><title>Login and register</title>
<rect width="960" height="600" fill="#fff"/>
<rect x="0" y="0" width="960" height="600" rx="0" fill="#f6f6f6" stroke="#ddd" stroke-width="1.5"/>
<rect x="0" y="0" width="960" height="52" rx="0" fill="#fff" stroke="#ddd" stroke-width="1.5"/>
<text x="30" y="32" font-size="16" font-weight="700" fill="#222" text-anchor="start">Study AI</text>
<rect x="70" y="90" width="380" height="380" rx="10" fill="#fff" stroke="#888" stroke-width="1.5"/>
<text x="100" y="135" font-size="20" font-weight="700" fill="#222" text-anchor="start">Log in</text>
<text x="100" y="175" font-size="11" font-weight="normal" fill="#666" text-anchor="start">Email</text>
<rect x="100" y="182" width="320" height="36" rx="5" fill="#fafafa" stroke="#999" stroke-width="1.5"/>
<text x="110" y="204.0" font-size="12" font-weight="normal" fill="#888" text-anchor="start">you@example.com</text>
<text x="100" y="248" font-size="11" font-weight="normal" fill="#666" text-anchor="start">Password</text>
<rect x="100" y="255" width="320" height="36" rx="5" fill="#fafafa" stroke="#999" stroke-width="1.5"/>
<text x="110" y="277.0" font-size="12" font-weight="normal" fill="#888" text-anchor="start">••••••••</text>
<rect x="100" y="320" width="320" height="40" rx="6" fill="#444" stroke="#444" stroke-width="1.5"/>
<text x="260.0" y="344.0" font-size="12" font-weight="600" fill="#fff" text-anchor="middle">Log in</text>
<text x="260" y="395" font-size="12" font-weight="normal" fill="#555" text-anchor="middle">No account? Register</text>
<text x="100" y="445" font-size="11" font-weight="normal" fill="#a33" text-anchor="start">Inline error text shown here on failure</text>
<rect x="510" y="90" width="380" height="380" rx="10" fill="#fff" stroke="#888" stroke-width="1.5"/>
<text x="540" y="135" font-size="20" font-weight="700" fill="#222" text-anchor="start">Create account</text>
<text x="540" y="175" font-size="11" font-weight="normal" fill="#666" text-anchor="start">Email</text>
<rect x="540" y="182" width="320" height="36" rx="5" fill="#fafafa" stroke="#999" stroke-width="1.5"/>
<text x="550" y="204.0" font-size="12" font-weight="normal" fill="#888" text-anchor="start">you@example.com</text>
<text x="540" y="248" font-size="11" font-weight="normal" fill="#666" text-anchor="start">Password</text>
<rect x="540" y="255" width="320" height="36" rx="5" fill="#fafafa" stroke="#999" stroke-width="1.5"/>
<text x="550" y="277.0" font-size="12" font-weight="normal" fill="#888" text-anchor="start">••••••••</text>
<rect x="540" y="320" width="320" height="40" rx="6" fill="#444" stroke="#444" stroke-width="1.5"/>
<text x="700.0" y="344.0" font-size="12" font-weight="600" fill="#fff" text-anchor="middle">Register</text>
<text x="700" y="395" font-size="12" font-weight="normal" fill="#555" text-anchor="middle">Have an account? Log in</text>
<text x="540" y="445" font-size="11" font-weight="normal" fill="#a33" text-anchor="start">Inline error text shown here on failure</text>
<text x="250" y="500" font-size="12" font-weight="600" fill="#777" text-anchor="middle">/login</text>
<text x="690" y="500" font-size="12" font-weight="600" fill="#777" text-anchor="middle">/register</text>
</svg>